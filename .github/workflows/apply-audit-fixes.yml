name: Apply traffic-audit fixes

on:
  workflow_dispatch:
  push:
    branches: [claude/traffic-drop-investigation-t3abnx]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fix scripts
        run: |
          set -euo pipefail
          echo "stubs before: $(grep -l 'http-equiv=\"refresh\"' *.html | wc -l)"
          echo "sitemap urls before: $(grep -c '<loc>' sitemap.xml)"
          python3 scripts/apply_audit_fixes.py
          python3 scripts/rewrite_redirect_stubs.py
          python3 scripts/rewrite_stub_links.py
          python3 scripts/gen_redirects.py
          node scripts/gen-sitemap.mjs
          node scripts/check-indexability.mjs

      - name: Validate
        run: |
          set -euo pipefail
          n=$(grep -l 'http-equiv="refresh"' *.html | wc -l)
          echo "stubs after: $n"
          [ "$n" -eq 755 ] || { echo "unexpected stub count $n"; exit 1; }
          python3 scripts/rewrite_stub_links.py | tee /tmp/links.txt
          grep -q 'remaining live->stub links: 0' /tmp/links.txt
          [ "$(grep -c 'extension/' sitemap.xml || true)" -eq 0 ]
          [ "$(grep -c '"@type": "FAQPage"' blog/how-to-spot-a-fake-amazon-discount-in-10-seconds.html)" -eq 1 ]
          [ "$(grep -c 'laptop backpack' blog/how-to-spot-a-fake-amazon-discount-in-10-seconds.html || true)" -eq 0 ]
          grep -q 'Buying guides' index.html
          grep -q 'Buying guides' app/index.html
          grep -q '/deal-check.html' index.html
          grep -q 'content="noindex' extension/test/mock-product.html
          [ "$(grep -c -E '/(electronics|home|kitchen)\.html' _redirects || true)" -eq 0 ]
          echo "_redirects lines: $(wc -l < _redirects)"
          grep -q 'content="0;url=/air-fryer.html"' air-fryer-under-25.html
          grep -q 'location.replace' air-fryer-under-25.html
          ! grep -q 'warm-theme.css' air-fryer-under-25.html
          ! grep -q 'track.js' air-fryer-under-25.html
          python3 - <<'PY'
          import json, re, subprocess
          files = subprocess.check_output(['git', 'diff', '--name-only', '--', '*.html']).decode().split()
          bad = 0
          for f in files:
              src = open(f, encoding='utf-8', errors='ignore').read()
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', src, re.S):
                  try:
                      json.loads(m.group(1))
                  except Exception as e:
                      bad += 1
                      print('BAD JSON-LD', f, e)
          print('json-ld checked in', len(files), 'changed html files; bad blocks:', bad)
          raise SystemExit(1 if bad else 0)
          PY
          git diff --stat | tail -1
          changed=$(git diff --name-only | wc -l)
          [ "$changed" -le 850 ] || { echo "too many files changed: $changed"; exit 1; }

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -F - <<'MSG'
          Rebuild redirect stubs, repoint stub links, and apply audit fixes [skip ci]

          Runs the scripts added in df4a272:

          - 755 redirect stubs rebuilt as minimal pages: meta refresh + canonical +
            one GA4 hit, then location.replace() carrying query/hash. No fonts, CSS
            or track.js are downloaded before the hop (was 0.75-1.75 s per redirect).
          - Links on category hubs, guides and ItemList JSON-LD that still pointed
            at stubs now go straight to the live page; "$N" pill labels match the
            page they open; duplicate ItemList entries removed.
          - Homepage crawlable block links the 23 rewritten buying guides and the
            deal checker (previously one inbound link each, none for deal-check).
          - Removed the off-topic laptop-backpack FAQPage block from the
            fake-discount post; breadcrumb items on four guides use the .html
            canonical.
          - extension/test/mock-product.html is noindex and out of the sitemap.
          - _redirects regenerated from the stubs (both URL forms, plus
            extensionless -> .html for live pages); sitemaps regenerated.

          Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01BXpd8a5KkYsZotJ4HXcYLY
          MSG
          git push origin HEAD:claude/traffic-drop-investigation-t3abnx
