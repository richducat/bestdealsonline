<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="0.45" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#fde68a" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- subtle grid -->
  <g opacity="0.12">
    <path d="M0 110H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M0 220H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M0 330H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M0 440H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M0 550H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M140 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M280 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M420 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M560 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M700 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M840 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M980 0V630" stroke="#ffffff" stroke-width="1" />
    <path d="M1120 0V630" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- badge -->
  <g filter="url(#softShadow)">
    <rect x="90" y="86" rx="18" ry="18" width="80" height="80" fill="#fbbf24" />
    <text x="130" y="141" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="#0b1220">B</text>
  </g>

  <text x="190" y="138" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff">BestDealsOnline</text>
  <text x="190" y="170" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#fde68a">AMAZON PICKS • UPDATED OFTEN</text>

  <text x="90" y="275" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff">Best deals online</text>
  <text x="90" y="330" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600" fill="#dbeafe">Electronics • Home • Kitchen • Tools</text>

  <rect x="90" y="390" rx="999" ry="999" width="520" height="54" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.45)" />
  <text x="115" y="425" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="url(#accent)">Click through to see live prices</text>

  <text x="90" y="560" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#93c5fd">bestdealsonline.us</text>
