<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Deals Online</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f6f8;
      color: #1f2937;
    }

    main {
      max-width: 680px;
      padding: 48px 24px;
      margin: 24px;
      display: grid;
      gap: 16px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 40px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .status {
      font-weight: 600;
      color: #0f766e;
    }

    .hint {
      font-size: 0.95rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <main>
    <h1>Best Deals Online</h1>
    <p>We're preparing a curated lineup of the latest deals, promos, and savings tips.</p>
    <p class="status">Site status: Online and loading.</p>
    <p class="hint">If you're seeing this page, the site is up and responding.</p>
  </main>
</body>
</html>
